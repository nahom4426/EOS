<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF0B9" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#6B4E03" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9B111E" />
      <stop offset="100%" stop-color="#580008" />
    </linearGradient>
  </defs>

  <!-- Background Glow Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#glowGrad)" />

  <!-- Outer Ring / Halo -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2 3" />
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#goldGrad)" stroke-width="1" />

  <!-- Ethiopian Processional Cross Geometry (Lalibela Lattice Style) -->
  <g fill="url(#goldGrad)" stroke="#580008" stroke-width="0.5">
    <!-- Center Square & Cross Core -->
    <rect x="42" y="42" width="16" height="16" rx="2" />
    <circle cx="50" cy="50" r="4" fill="url(#crimsonGrad)" />

    <!-- Vertical Shafts -->
    <path d="M 44,42 L 44,14 C 44,12 40,8 50,4 C 60,8 56,12 56,14 L 56,42 Z" />
    <path d="M 44,58 L 44,86 C 44,88 40,92 50,96 C 60,92 56,88 56,86 L 56,58 Z" />
    <path d="M 42,44 L 14,44 C 12,44 8,40 4,50 C 8,60 12,56 14,56 L 42,56 Z" />
    <path d="M 58,44 L 86,44 C 88,44 92,40 96,50 C 92,60 88,56 86,56 L 58,56 Z" />

    <!-- Ornate Cross Head Finials / Lattice Windows -->
    <!-- Top Finial -->
    <rect x="40" y="10" width="20" height="12" rx="3" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="50" cy="16" r="3" fill="url(#crimsonGrad)" />
    <circle cx="50" cy="4" r="3" fill="url(#goldGrad)" />
    <circle cx="36" cy="16" r="2.5" fill="url(#goldGrad)" />
    <circle cx="64" cy="16" r="2.5" fill="url(#goldGrad)" />

    <!-- Bottom Finial -->
    <rect x="40" y="78" width="20" height="12" rx="3" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="50" cy="84" r="3" fill="url(#crimsonGrad)" />
    <circle cx="50" cy="96" r="3" fill="url(#goldGrad)" />
    <circle cx="36" cy="84" r="2.5" fill="url(#goldGrad)" />
    <circle cx="64" cy="84" r="2.5" fill="url(#goldGrad)" />

    <!-- Left Finial -->
    <rect x="10" y="40" width="12" height="20" rx="3" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="16" cy="50" r="3" fill="url(#crimsonGrad)" />
    <circle cx="4" cy="50" r="3" fill="url(#goldGrad)" />
    <circle cx="16" cy="36" r="2.5" fill="url(#goldGrad)" />
    <circle cx="16" cy="64" r="2.5" fill="url(#goldGrad)" />

    <!-- Right Finial -->
    <rect x="78" y="40" width="12" height="20" rx="3" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="84" cy="50" r="3" fill="url(#crimsonGrad)" />
    <circle cx="96" cy="50" r="3" fill="url(#goldGrad)" />
    <circle cx="84" cy="36" r="2.5" fill="url(#goldGrad)" />
    <circle cx="84" cy="64" r="2.5" fill="url(#goldGrad)" />
  </g>
</svg>
